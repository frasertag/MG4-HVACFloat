name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-release-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload APK assets
        uses: softprops/action-gh-release@v2
        with:
          name: HVAC Float ${{ github.ref_name }}
          body: Release HVAC Float ${{ github.ref_name }}
          files: |
            dist/MG4-HVACFloat-V*.apk
            dist/MG4-HVACFloat-V*.apk.sha256
          fail_on_unmatched_files: true
          make_latest: true
